name: Validate RevenuePilot
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node: 24.22.1
          - os: windows-latest
            node: 24.11.0
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high
      - run: docker compose config --quiet
        if: runner.os == 'Linux'
        env:
          DATA_ENCRYPTION_KEY: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
      - name: Validate isolated production template
        run: docker compose -f compose.production.yaml config --quiet
        if: runner.os == 'Linux'
        env:
          DATA_ENCRYPTION_KEY: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          MONGODB_URI: mongodb://synthetic:synthetic@mongo.example.test/revenuepilot?replicaSet=rs0
          REDIS_URL: rediss://synthetic:synthetic@redis.example.test:6379
          WEB_ORIGIN: https://pilot.example.test
          TRUST_PROXY_CIDRS: 172.30.84.0/24

      - name: Validate Hostinger configuration and preflight
        if: runner.os == 'Linux'
        env:
          DATA_ENCRYPTION_KEY: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          MONGODB_URI: mongodb://synthetic:synthetic@mongo.example.test/revenuepilot?replicaSet=rs0
          REDIS_URL: rediss://synthetic:synthetic@redis.example.test:6379
          WEB_ORIGIN: https://revenuepilot.example.test
          REVENUEPILOT_DOMAIN: revenuepilot.example.test
          TRUST_PROXY_CIDRS: 172.30.84.0/24
        run: |
          python3 scripts/test-hostinger-preflight.py
          docker compose -f compose.production.yaml -f compose.hostinger.yaml config --quiet
          docker run --rm -e REVENUEPILOT_DOMAIN -v "$PWD/deploy/hostinger/Caddyfile:/etc/caddy/Caddyfile:ro" caddy:2.11.9-alpine caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile

  docker-stack:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATA_ENCRYPTION_KEY: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.1
      - run: docker compose up -d --build --wait --wait-timeout 180
      - run: node scripts/smoke-stack.mjs
      - name: Verify an isolated backup and restore
        run: |
          docker compose stop -t 30 web api collector worker
          docker compose exec -T mongo mongodump --db revenuepilot --archive --gzip > /tmp/rp-ci.archive.gz
          docker compose exec -T mongo mongorestore --archive --gzip --nsFrom='revenuepilot.*' --nsTo='rp_restore_check.*' < /tmp/rp-ci.archive.gz
          docker compose exec -T mongo mongosh --quiet --eval "const s=db.getSiblingDB('revenuepilot'); const r=db.getSiblingDB('rp_restore_check'); for (const name of s.getCollectionNames().filter(n=>n!=='rate_buckets')) { if(s.getCollection(name).countDocuments({}) !== r.getCollection(name).countDocuments({})) throw new Error('Restore count mismatch: '+name); } print('Isolated restore verified');"
      - name: Container diagnostics
        if: failure()
        run: docker compose logs --tail=100
      - name: Remove isolated CI resources
        if: always()
        run: docker compose down --volumes

  hostinger-stack:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.1
      - name: Create and verify private synthetic settings
        run: |
          python3 scripts/test-hostinger-preflight.py
          python3 scripts/test-hostinger-setup.py
          python3 scripts/setup-hostinger.py --domain revenuepilot.example.test --expected-ip 203.0.113.12
          docker compose -p revenuepilot-vps-ci --env-file .env.hostinger -f compose.production.yaml -f compose.database.yaml -f compose.hostinger.yaml config --quiet
      - name: Boot isolated production services without public edge
        run: docker compose -p revenuepilot-vps-ci --env-file .env.hostinger -f compose.production.yaml -f compose.database.yaml -f compose.hostinger.yaml up -d --build --wait --wait-timeout 240 api collector worker web
      - name: Test owner, TLS databases, worker, persistence and restore
        run: python3 scripts/smoke-hostinger.py
      - name: Synthetic CI diagnostics
        if: failure()
        run: docker compose -p revenuepilot-vps-ci --env-file .env.hostinger -f compose.production.yaml -f compose.database.yaml -f compose.hostinger.yaml logs --tail=80
      - name: Remove isolated CI resources
        if: always()
        run: docker compose -p revenuepilot-vps-ci --env-file .env.hostinger -f compose.production.yaml -f compose.database.yaml -f compose.hostinger.yaml down --volumes
